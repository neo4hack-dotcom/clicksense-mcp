# ClickSense configuration. Generated by `clicksense-admin config --example` from the code
# (src/clicksense/config.py): every key, its default and its meaning. Do not edit this file:
# copy it to clicksense.yaml and change your copy. Secrets (passwords, keys, tokens) go in .env.
# Resolution order: defaults < this file (${VAR} / ${VAR:-default} from the environment)
# < the environment variables named below. Restart the server after a change.

# ClickHouse connection.
connection:
  # ClickHouse host name or IP. [env: CLICKSENSE_HOST]
  host: ${CLICKSENSE_HOST:-localhost}
  # ClickHouse HTTP port (8123, or 8443 with secure: true). Not the native port 9000. [env:
  # CLICKSENSE_PORT]
  port: ${CLICKSENSE_PORT:-8123}
  # ClickHouse user. Must be a read-only account (readonly = 2). [env: CLICKSENSE_USER]
  username: ${CLICKSENSE_USER:-default}
  # Password of that user. Put it in .env, not in this file. [env: CLICKSENSE_PASSWORD]
  password: ${CLICKSENSE_PASSWORD:-}
  # Use HTTPS to talk to ClickHouse. [env: CLICKSENSE_SECURE]
  secure: ${CLICKSENSE_SECURE:-false}
  # Database used for unqualified table names (e.g. `orders` -> `shop.orders`). [env:
  # CLICKSENSE_DATABASE]
  database: ${CLICKSENSE_DATABASE:-default}
  # Seconds to wait for a TCP connection before giving up.
  connect_timeout: 5
  # Seconds to wait for a response. Keep it above limits.max_execution_time.
  send_receive_timeout: 90
  # HTTP connections kept open to ClickHouse. Keep it >= limits.max_concurrent.
  pool_size: 8
  # Transport compression: lz4 (fast), zstd, gzip, or false.
  compress: lz4

# Guard-rails sent with every query.
limits:
  # Rows returned when the caller does not ask for a number.
  default_rows: 200
  # Maximum rows a caller may request. Larger answers must be aggregated.
  hard_max_rows: 5000
  # Size budget of a result payload; beyond it the result is truncated and says so.
  max_response_bytes: 200000
  # Longest SQL statement accepted.
  max_sql_chars: 20000
  # Seconds before ClickHouse aborts a query (error timeout).
  max_execution_time: 20
  # Bytes of memory one query may use (error memory_limit).
  max_memory_usage: 1000000000
  # CPU threads one query may use. Lower it on a busy cluster.
  max_threads: 4
  # Rows one query may read from disk.
  max_rows_to_read: 1000000000
  # Bytes one query may read from disk.
  max_bytes_to_read: 100000000000
  # Above this, GROUP BY spills to disk instead of failing on memory.
  max_bytes_before_external_group_by: 500000000
  # Above this, ORDER BY spills to disk.
  max_bytes_before_external_sort: 500000000
  # Run EXPLAIN ESTIMATE (index analysis, no data read) before queries on big tables.
  preflight: true
  # Refuse a query whose estimate exceeds this many rows (error too_expensive). Raise it if
  # legitimate queries are refused.
  preflight_max_rows: 300000000
  # Queries in flight at the same time from this server.
  max_concurrent: 4
  # Seconds a query waits for a free slot before failing with `busy`.
  queue_timeout_s: 15
  # Queries per minute (token bucket). Beyond it: rate_limited.
  rate_per_minute: 240
  # Consecutive load failures (timeout, memory, network...) that pause all queries. Bad SQL does
  # not count.
  breaker_failures: 4
  # Seconds the pause lasts.
  breaker_cooldown_s: 30
  # Seconds an identical query is answered from memory. 0 disables.
  result_cache_ttl_s: 120
  # Results kept in the in-memory cache.
  result_cache_entries: 256
  # Use ClickHouse's own query cache (ClickHouse 23.1+).
  use_query_cache: true
  # Seconds a result stays in ClickHouse's query cache.
  query_cache_ttl_s: 300

# What the guard accepts.
policy:
  # Databases the agent may query. Empty = every non-system database the account can see.
  allowed_databases: []
  # Tables hidden and refused, as "db.table".
  denied_tables: []
  # Table functions allowed in FROM. External ones (url, s3, remote, file, mysql...) are always
  # refused.
  allowed_table_functions: [numbers]
  # block: columns marked `pii: true` in the dictionary can be filtered or aggregated but never
  # returned raw. allow: no restriction.
  pii: block
  # When sqlglot cannot parse valid ClickHouse SQL, ask ClickHouse's own parser (EXPLAIN AST,
  # reads no data) instead of refusing.
  server_parse_fallback: true

# HTTP transport for remote MCP clients.
http:
  # Bind address. 127.0.0.1 = this machine only; 0.0.0.0 = the network (tokens then required).
  # [env: CLICKSENSE_HTTP_HOST]
  host: ${CLICKSENSE_HTTP_HOST:-127.0.0.1}
  # HTTP port. The MCP endpoint is http://<host>:<port>/mcp. [env: CLICKSENSE_HTTP_PORT]
  port: ${CLICKSENSE_HTTP_PORT:-3110}
  # Accepted bearer tokens, at least 24 characters each. In the environment: comma-separated.
  # Generate one with `clicksense --gen-token`. [env: CLICKSENSE_HTTP_TOKENS]
  tokens: []
  # Allow listening on the network WITHOUT a token. Leave false.
  allow_unauthenticated_remote: false

# OpenAI-compatible model for clicksense-chat.
llm:
  # API base URL. Empty = $OPENAI_BASE_URL, else https://api.openai.com/v1.
  base_url:
  # API key. Prefer OPENAI_API_KEY or CLICKSENSE_LLM_API_KEY in .env.
  # api_key:
  # Model name. It must support tool (function) calling. [env: CLICKSENSE_LLM_MODEL]
  model: ${CLICKSENSE_LLM_MODEL:-gpt-4.1-mini}
  # Sampling temperature. Empty = provider default (some reasoning models reject the parameter).
  temperature:
  # Tool-call rounds allowed per question before giving up.
  max_steps: 16
  # Call get_context before the model's first turn, so ambiguities reach it even if it would
  # skip that step.
  auto_context: true
  # A tool result longer than this is truncated before the model sees it.
  max_tool_chars: 12000
  # Seconds to wait for the LLM API.
  timeout_s: 120
  # Extra HTTP headers for the LLM API (gateways, Azure...).
  extra_headers: {}
  # Empty = run ClickSense in-process. Else the URL of a running server, e.g.
  # http://winserver:3110/mcp.
  mcp_url:
  # Bearer token sent to mcp_url. [env: CLICKSENSE_MCP_TOKEN]
  mcp_token: ${CLICKSENSE_MCP_TOKEN:-}

# Folder of the semantic layer (dictionary, glossary, metrics, knowledge, skills). Relative to
# this file.
semantic_dir: semantic
# JSONL audit log of every query. Empty disables it.
audit_path: audit/clicksense.jsonl
# Seconds the live schema is cached. refresh_catalog reloads it at once.
catalog_ttl_s: 600
# Seconds the distinct values of a column are cached (used to resolve 'France' -> 'FR').
value_cache_ttl_s: 3600
# Above this many distinct values a column is searched live instead of cached.
value_cache_max_distinct: 2000
# Tables larger than this are sampled or time-windowed when their values are enumerated.
value_scan_max_rows: 50000000

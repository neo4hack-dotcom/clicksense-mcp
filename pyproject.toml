[project]
name = "clicksense"
version = "1.0.0"
description = "ClickHouse MCP server: semantic layer (dictionary, glossary, metrics, knowledge, skills) + guarded, bounded SQL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.14",
    "sqlglot>=27",
    "clickhouse-connect>=0.8",
    "lz4>=4",
    "pydantic>=2.9",
    "pyyaml>=6",
    "rapidfuzz>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
docs = ["reportlab>=4.2"]
llm = ["openai>=1.40"]

[project.scripts]
clicksense = "clicksense.server:main"
clicksense-chat = "clicksense.chat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clicksense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the local ClickHouse from scripts/dev-clickhouse.sh"]
